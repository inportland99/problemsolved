<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Teacher</title>
  <meta name="description" content="Add or edit a teacher account">
  <link rel="stylesheet" href="/styles/output.css">
  
</head>
<body class="min-h-screen">
  
<div class="min-h-screen bg-base-200">
  <!-- Header -->
  <div class="navbar bg-base-100 shadow-lg">
    <div class="flex-1">
      <a href="/teacherportal/teacher-index/" class="btn btn-ghost normal-case text-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Back to Teachers
      </a>
    </div>
    <div class="flex-none gap-2">
      <span id="user-badge" class="text-sm text-base-content/70 hidden sm:inline"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
    </div>
  </div>

  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 id="page-title" class="text-3xl font-bold mb-8">Add Teacher</h1>

    <!-- Alert messages -->
    <div id="alert-container" class="mb-4"></div>

    <!-- Loading state (for edit mode) -->
    <div id="loading" class="hidden flex justify-center items-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Form -->
    <form id="teacher-form" class="space-y-6">
      <input type="hidden" id="teacher-id">
      <input type="hidden" id="teacher-auth-id">

      <!-- Name -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Name <span class="text-error">*</span></span>
        </label>
        <input type="text" id="name" class="input input-bordered" placeholder="Full name" required>
      </div>

      <!-- Email -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Email <span class="text-error">*</span></span>
        </label>
        <input type="email" id="email" class="input input-bordered" placeholder="teacher@example.com" required>
        <label class="label">
          <span id="email-hint" class="label-text-alt"></span>
        </label>
      </div>

      <!-- District -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">District</span>
        </label>
        <select id="district-id" class="select select-bordered w-full">
          <option value="">All Districts (admin only)</option>
        </select>
      </div>

      <!-- Role -->
      <div class="form-control">
        <label class="label">
          <span class="label-text font-semibold">Role <span class="text-error">*</span></span>
        </label>
        <select id="role" class="select select-bordered w-full" required>
          <option value="teacher">Teacher</option>
          <option value="district_admin">District Admin</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <!-- Submit Button -->
      <div class="flex gap-4 pt-4">
        <button type="submit" id="submit-btn" class="btn btn-primary flex-1">
          <span id="submit-text">Add Teacher</span>
          <span id="submit-loading" class="loading loading-spinner hidden"></span>
        </button>
        <a href="/teacherportal/teacher-index/" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { requireAuth, logout, isAdmin, renderUserBadge } from '/assets/js/teacher-portal-auth-guard.js';
import { getAllTeachers, createTeacherRow, updateTeacherRow } from '/assets/js/teachers-db.js';
import { getAllDistricts } from '/assets/js/districts-db.js';
import { supabase } from '/assets/js/lessons-supabase-client.js';

// Auth guard -- this page is admin-only, not just authenticated
await requireAuth();
const adminUser = await isAdmin();
if (!adminUser) {
  window.location.href = '/teacherportal/';
  throw new Error('Admin access required');
}
renderUserBadge('user-badge');

// Logout button
document.getElementById('logout-btn').addEventListener('click', logout);

let isEditMode = false;

// Get teacher ID from URL if editing
const urlParams = new URLSearchParams(window.location.search);
const teacherId = urlParams.get('id');

// Alert helper
function showAlert(message, type = 'info') {
  const container = document.getElementById('alert-container');
  const alert = document.createElement('div');
  alert.className = `alert alert-${type} shadow-lg`;
  alert.innerHTML = `<span>${message}</span>`;
  container.appendChild(alert);
  setTimeout(() => alert.remove(), 5000);
}

// supabase-js only surfaces a generic "non-2xx" message on Edge Function
// errors -- the real message is in the response body, under error.context.
async function extractFunctionErrorMessage(error) {
  if (error?.context && typeof error.context.json === 'function') {
    try {
      const body = await error.context.json();
      if (body?.error) return body.error;
    } catch (_) {
      // fall through to generic message below
    }
  }
  return error?.message || 'Unknown error';
}

// Populate district dropdown
const districtsResult = await getAllDistricts();
const districts = districtsResult.success ? districtsResult.data : [];
const districtSelect = document.getElementById('district-id');
districts.forEach(d => {
  const opt = document.createElement('option');
  opt.value = d.id;
  opt.textContent = d.name;
  districtSelect.appendChild(opt);
});

// Load existing teacher for editing
async function loadTeacher(id) {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('teacher-form').classList.add('hidden');

  const result = await getAllTeachers();

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('teacher-form').classList.remove('hidden');

  if (!result.success) {
    showAlert(result.error?.message || 'Failed to load teacher', 'error');
    return;
  }

  const teacher = result.data.find(t => t.id === id);
  if (!teacher) {
    showAlert('Teacher not found', 'error');
    return;
  }

  isEditMode = true;

  document.getElementById('page-title').textContent = 'Edit Teacher';
  document.getElementById('submit-text').textContent = 'Save Changes';

  document.getElementById('teacher-id').value = teacher.id;
  document.getElementById('teacher-auth-id').value = teacher.auth_id;
  document.getElementById('name').value = teacher.name || '';
  document.getElementById('email').value = teacher.email || '';
  document.getElementById('district-id').value = teacher.district_id || '';
  document.getElementById('role').value = teacher.role || 'teacher';

  // Email/login is not editable here -- changing it requires a separate
  // Admin API call that isn't wired up in this pass.
  const emailInput = document.getElementById('email');
  emailInput.disabled = true;
  document.getElementById('email-hint').textContent =
    'Login email cannot be changed here.';
}

// Form submission
document.getElementById('teacher-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const submitBtn = document.getElementById('submit-btn');
  const submitText = document.getElementById('submit-text');
  const submitLoading = document.getElementById('submit-loading');

  submitBtn.disabled = true;
  submitText.classList.add('hidden');
  submitLoading.classList.remove('hidden');

  try {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const districtId = document.getElementById('district-id').value || null;
    const role = document.getElementById('role').value;

    if (!name || !email || !role) {
      showAlert('Please fill in all required fields', 'error');
      return;
    }

    if (isEditMode) {
      const result = await updateTeacherRow(document.getElementById('teacher-id').value, {
        name,
        districtId,
        role
      });

      if (result.success) {
        showAlert('Teacher updated!', 'success');
        setTimeout(() => {
          window.location.href = '/teacherportal/teacher-index/';
        }, 1000);
      } else {
        showAlert(result.error?.message || 'Failed to update teacher', 'error');
      }
    } else {
      // Invite the login via the Edge Function (privileged operation).
      // redirectTo must also be added to the project's Auth "Redirect URLs"
      // allow-list in Supabase, or it's silently ignored.
      const redirectTo = `${window.location.origin}/teacherportal/reset-password/?email=${encodeURIComponent(email)}&type=invite`;
      const { data, error } = await supabase.functions.invoke('teacherportal-admin', {
        body: { action: 'invite', email, redirectTo },
      });

      if (error) throw new Error(await extractFunctionErrorMessage(error));
      if (data?.error) throw new Error(data.error);

      const result = await createTeacherRow({
        authId: data.authId,
        name,
        email,
        districtId,
        role
      });

      if (result.success) {
        showAlert('Teacher added! An invite email has been sent to set their password.', 'success');
        setTimeout(() => {
          window.location.href = '/teacherportal/teacher-index/';
        }, 1500);
      } else {
        showAlert(result.error?.message || 'Login was created, but saving the teacher record failed. Check Supabase Auth for a stray user.', 'error');
      }
    }
  } catch (err) {
    showAlert(err.message || 'Failed to save teacher', 'error');
  } finally {
    submitBtn.disabled = false;
    submitText.classList.remove('hidden');
    submitLoading.classList.add('hidden');
  }
});

// Initialize
if (teacherId) {
  loadTeacher(teacherId);
}
</script>

</body>
</html>
